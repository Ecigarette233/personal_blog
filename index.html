<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>我的健身进度 · Fitness Journey</title>
<style>
  :root {
    --bg: #0b0f0e;
    --bg-soft: #121817;
    --card: #161d1b;
    --line: #26322e;
    --text: #e8efec;
    --muted: #93a39d;
    --accent: #a3e635;      /* lime */
    --accent-2: #22c55e;    /* green */
    --accent-glow: rgba(163, 230, 53, 0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }

  /* ---------- Hero ---------- */
  header {
    position: relative;
    padding: 96px 0 64px;
    text-align: center;
    overflow: hidden;
  }
  header::before {
    content: "";
    position: absolute;
    inset: -40% -20%;
    background:
      radial-gradient(600px 320px at 20% 10%, var(--accent-glow), transparent 60%),
      radial-gradient(500px 300px at 80% 20%, rgba(34, 197, 94, 0.14), transparent 60%);
    filter: blur(10px);
    z-index: -1;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid var(--line);
    background: rgba(163, 230, 53, 0.06);
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  .eyebrow .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }
  h1 {
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  h1 .grad {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .subtitle {
    margin-top: 18px;
    font-size: 1.05rem;
    color: var(--muted);
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
  }

  /* ---------- Stats ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 8px 0 72px;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 18px;
    text-align: center;
  }
  .stat .num {
    font-size: 2rem;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -0.02em;
  }
  .stat .label {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  /* ---------- Timeline ---------- */
  section.timeline { padding-bottom: 40px; }
  .section-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .section-hint {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 40px;
  }

  .timeline-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 28px;
  }
  .entry {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 28px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    transition: transform 0.25s ease, border-color 0.25s ease;
  }
  .entry:hover {
    transform: translateY(-4px);
    border-color: var(--accent-2);
  }
  .entry .photo {
    position: relative;
    aspect-ratio: 4 / 5;
    background: #0f1513;
    cursor: zoom-in;
    overflow: hidden;
  }
  .entry .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }
  .entry:hover .photo img { transform: scale(1.04); }
  .entry .photo .badge {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(11, 15, 14, 0.75);
    backdrop-filter: blur(6px);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.8rem;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(163, 230, 53, 0.3);
  }
  .entry .info { padding: 28px 26px; display: flex; flex-direction: column; }
  .entry .info .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .entry .info h3 {
    font-size: 1.35rem;
    font-weight: 700;
  }
  .entry .info .date {
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .entry .info .note {
    margin-top: 14px;
    color: var(--muted);
    font-size: 0.95rem;
    flex: 1;
  }
  .entry .meta {
    margin-top: 18px;
    display: flex;
    gap: 18px;
    flex-wrap: wrap;
  }
  .entry .meta .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    color: var(--text);
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--line);
    padding: 7px 13px;
    border-radius: 10px;
  }
  .entry .meta .chip b { color: var(--accent); font-weight: 700; }

  /* ---------- Progress meter ---------- */
  .meter {
    margin: 0 0 72px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 28px;
  }
  .meter .meter-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .meter .meter-head span { color: var(--muted); font-size: 0.9rem; }
  .meter .meter-head b { color: var(--accent); font-size: 1.3rem; }
  .meter .bar {
    height: 12px;
    background: #0e1513;
    border-radius: 999px;
    overflow: hidden;
  }
  .meter .bar .fill {
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    box-shadow: 0 0 18px var(--accent-glow);
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .meter .ticks {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 48px 0 72px;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--line);
  }

  /* ---------- Lightbox ---------- */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(5, 8, 7, 0.92);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .lightbox.open { display: flex; }
  .lightbox .stage {
    max-width: min(92vw, 860px);
    width: 100%;
    text-align: center;
  }
  .lightbox img {
    max-width: 100%;
    max-height: 78vh;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
  }
  .lightbox .caption {
    margin-top: 16px;
    color: var(--text);
    font-size: 1rem;
  }
  .lightbox .caption .date { color: var(--muted); margin-left: 10px; }
  .lightbox .btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    color: var(--text);
    width: 52px;
    height: 52px;
    border-radius: 50%;
    font-size: 1.4rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lightbox .btn:hover { background: rgba(163, 230, 53, 0.16); }
  .lightbox .btn.prev { left: 20px; }
  .lightbox .btn.next { right: 20px; }
  .lightbox .close {
    position: absolute;
    top: 22px;
    right: 26px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--line);
    color: var(--text);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
  }
  .lightbox .close:hover { background: rgba(255, 255, 255, 0.14); }

  /* ---------- Responsive ---------- */
  @media (max-width: 760px) {
    .stats { grid-template-columns: 1fr; gap: 12px; margin-bottom: 56px; }
    .entry { grid-template-columns: 1fr; }
    .entry .photo { aspect-ratio: 4 / 5; }
    .lightbox .btn.prev { left: 8px; }
    .lightbox .btn.next { right: 8px; }
    header { padding: 64px 0 48px; }
  }
</style>
</head>
<body>

  <header>
    <div class="wrap">
      <div class="eyebrow"><span class="dot"></span> Fitness Journey</div>
      <h1>我的健身<span class="grad">进步记录</span></h1>
      <p class="subtitle">每一次记录，都是对过去的自己的一次告别。坚持，就是最帅的样子。</p>
    </div>
  </header>

  <main class="wrap">
    <!-- 进度总览 -->
    <div class="meter">
      <div class="meter-head">
        <span>记录完成度</span>
        <b id="meterPct">0 次</b>
      </div>
      <div class="bar"><div class="fill" id="meterFill"></div></div>
      <div class="ticks" id="meterTicks"></div>
    </div>

    <!-- 数据统计 -->
    <div class="stats" id="stats"></div>

    <!-- 记录时间线 -->
    <section class="timeline">
      <h2 class="section-title">记录时间线</h2>
      <p class="section-hint">点击任意照片可放大查看，按 ← → 键切换。</p>
      <div class="timeline-grid" id="timeline"></div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      保持热爱，坚持到底 · 每一次进步都值得被记录
    </div>
  </footer>

  <!-- 大图查看 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-label="照片查看器">
    <button class="close" id="lbClose" aria-label="关闭">&times;</button>
    <button class="btn prev" id="lbPrev" aria-label="上一张">&#10094;</button>
    <button class="btn next" id="lbNext" aria-label="下一张">&#10095;</button>
    <div class="stage">
      <img id="lbImg" src="" alt="" />
      <div class="caption" id="lbCaption"></div>
    </div>
  </div>

<script>
/* ============================================================
   在这里修改你的每次记录数据 —— 按时间顺序，从早到晚。
   date  : 记录日期（字符串，可留空）
   label : 阶段标题
   weight: 体重（kg，可留空，留空则不显示）
   note  : 备注（可留空）
   ============================================================ */
const CHECKINS = [
  { img: "czj/images/04.jpg", date: "", label: "第 1 次记录", weight: "", note: "最开始只是在健身房锻炼，想把自己肌肉练大。" },
  { img: "czj/images/02.jpg", date: "", label: "第 2 次记录", weight: "", note: "已经初具成果。" },
  { img: "czj/images/05.jpg", date: "", label: "第 3 次记录", weight: "", note: "慢慢的我也练出了鬼背。" },
  { img: "czj/images/01.jpg", date: "", label: "第 4 次记录", weight: "", note: "居然慢慢长出了金色光翅膀。" },
  { img: "czj/images/03.jpg", date: "", label: "第 5 次记录", weight: "", note: "天使之翼降临，凡人恐惧我吧！" },
];

const $ = (s) => document.querySelector(s);

/* ---------- 渲染统计 ---------- */
function renderStats() {
  const total = CHECKINS.length;
  const withWeight = CHECKINS.filter(c => c.weight);
  const latest = withWeight.length ? withWeight[withWeight.length - 1] : null;
  const first = withWeight.length ? withWeight[0] : null;
  let delta = "—";
  if (first && latest && first.weight && latest.weight) {
    const d = (parseFloat(latest.weight) - parseFloat(first.weight)).toFixed(1);
    delta = (d > 0 ? "+" : "") + d + " kg";
  }
  const cards = [
    { num: total + " 次", label: "累计记录" },
    { num: latest ? latest.weight + " kg" : "—", label: "最新体重" },
    { num: delta, label: "总变化" },
  ];
  $("#stats").innerHTML = cards.map(c =>
    `<div class="stat"><div class="num">${c.num}</div><div class="label">${c.label}</div></div>`
  ).join("");
}

/* ---------- 渲染进度条 ---------- */
function renderMeter() {
  const total = CHECKINS.length;
  const pct = 100; // 所有已收录的记录，完成度按 100% 展示
  $("#meterPct").textContent = total + " 次";
  $("#meterFill").style.width = pct + "%";
  $("#meterTicks").innerHTML = CHECKINS.map((_, i) => `<span>${i + 1}</span>`).join("");
}

/* ---------- 渲染时间线 ---------- */
function renderTimeline() {
  $("#timeline").innerHTML = CHECKINS.map((c, i) => {
    const weightChip = c.weight
      ? `<span class="chip">体重 <b>${c.weight} kg</b></span>` : "";
    const dateHtml = c.date ? `<span class="date">${c.date}</span>` : "";
    const noteHtml = c.note ? `<p class="note">${c.note}</p>` : "";
    return `
      <div class="entry" data-index="${i}">
        <div class="photo" data-index="${i}" title="点击查看大图">
          <img src="${c.img}" alt="${c.label}" loading="lazy" />
          <span class="badge">#${i + 1}</span>
        </div>
        <div class="info">
          <div class="top">
            <h3>${c.label}</h3>
            ${dateHtml}
          </div>
          ${noteHtml}
          <div class="meta">${weightChip}</div>
        </div>
      </div>`;
  }).join("");
}

/* ---------- 大图查看器 ---------- */
let current = 0;
function openLightbox(i) {
  current = i;
  update();
  $("#lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
}
function update() {
  const c = CHECKINS[current];
  $("#lbImg").src = c.img;
  $("#lbImg").alt = c.label;
  $("#lbCaption").innerHTML = `<strong>${c.label}</strong>` +
    (c.date ? `<span class="date">${c.date}</span>` : "");
}
function closeLightbox() {
  $("#lightbox").classList.remove("open");
  document.body.style.overflow = "";
}
function step(n) {
  current = (current + n + CHECKINS.length) % CHECKINS.length;
  update();
}

document.addEventListener("click", (e) => {
  const photo = e.target.closest(".photo");
  if (photo) openLightbox(parseInt(photo.dataset.index, 10));
});
$("#lbClose").addEventListener("click", closeLightbox);
$("#lbPrev").addEventListener("click", () => step(-1));
$("#lbNext").addEventListener("click", () => step(1));
$("#lightbox").addEventListener("click", (e) => {
  if (e.target === $("#lightbox")) closeLightbox();
});
document.addEventListener("keydown", (e) => {
  if (!$("#lightbox").classList.contains("open")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- 初始化 ---------- */
renderStats();
renderMeter();
renderTimeline();
</script>
</body>
</html>
